name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify architecture, repository hygiene, and public Skills
        run: >-
          python -m unittest
          tests.architecture.test_public_architecture
          tests.architecture.test_repository_hygiene
          tests.skills.test_public_skill_packages
          tests.skills.test_public_orchestration_skills
          tests.skills.test_public_specialized_skills
          tests.skills.test_public_operational_skills

  seraphim-platform:
    name: Seraphim platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seraphim-platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify TypeScript and tests
        run: pnpm verify
      - name: Verify local bridge
        run: pnpm bridge:test

  eiram-engine:
    name: EI-RAM engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-portfolio/03_EIRAM_Analysis_Studio/engine-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app-portfolio/03_EIRAM_Analysis_Studio/engine-api/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run engine regression tests
        run: python -m pytest -q
      - name: Verify governed proof mission
        run: python -m pytest tests/test_proof_mission.py -q
