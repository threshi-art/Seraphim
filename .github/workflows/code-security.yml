name: Read only code security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '37 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned scanner
        run: python -m pip install semgrep==1.180.0
      - name: Scan and report locations only
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import tempfile

          report = pathlib.Path(tempfile.gettempdir()) / "semgrep-results.json"
          result = subprocess.run(
              ["semgrep", "scan", "--config", "p/security-audit", "--metrics=off",
               "--json", "--output", str(report), "."],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
          )
          if result.returncode not in (0, 1) or not report.exists():
              print("Static analysis did not complete.")
              sys.exit(2)
          data = json.loads(report.read_text(encoding="utf-8"))
          for finding in data.get("results", []):
              print(json.dumps({
                  "file": finding["path"],
                  "line": finding["start"]["line"],
                  "rule": finding["check_id"],
              }))
          errors = data.get("errors", [])
          blocking_errors = [error for error in errors if error.get("level") == "error"]
          print("Findings:", len(data.get("results", [])),
                "analysis errors:", len(blocking_errors))
          sys.exit(2 if blocking_errors else 1 if data.get("results") else 0)
          PY
