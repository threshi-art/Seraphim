name: Video retrieval fallback tests

on:
  pull_request:
    paths:
      - 'skills/media-ingest/youtube-eiram-ingest/scripts/**'
      - 'skills/media-ingest/youtube-eiram-ingest/tests/**'
      - '.github/workflows/video-retrieval-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline four-provider adapter tests
        run: python -m unittest discover -s skills/media-ingest/youtube-eiram-ingest/tests -v
